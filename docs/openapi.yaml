components:
  schemas:
    ContractCheckCreate:
      properties:
        version_id:
          type: string
          maxLength: 100
          minLength: 1
          title: Version Id
      additionalProperties: false
      type: object
      required:
      - version_id
      title: ContractCheckCreate
    ContractCompatibilityCreate:
      properties:
        baseline_contract_id:
          type: string
          maxLength: 100
          minLength: 1
          title: Baseline Contract Id
        candidate_contract_id:
          type: string
          maxLength: 100
          minLength: 1
          title: Candidate Contract Id
      additionalProperties: false
      type: object
      required:
      - baseline_contract_id
      - candidate_contract_id
      title: ContractCompatibilityCreate
    ContractField:
      properties:
        types:
          items:
            type: string
            enum:
            - string
            - integer
            - number
            - boolean
            - object
            - array
          type: array
          maxItems: 6
          minItems: 1
          title: Types
        required:
          type: boolean
          title: Required
          default: true
        nullable:
          type: boolean
          title: Nullable
          default: false
        max_missing_rate:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Max Missing Rate
          default: 0.0
        unique:
          type: boolean
          title: Unique
          default: false
      additionalProperties: false
      type: object
      required:
      - types
      title: ContractField
    DataContractCreate:
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 1
          title: Name
        description:
          anyOf:
          - type: string
            maxLength: 4000
          - type: 'null'
          title: Description
        fields:
          additionalProperties:
            $ref: '#/components/schemas/ContractField'
          type: object
          maxProperties: 200
          minProperties: 1
          title: Fields
        allow_extra:
          type: boolean
          title: Allow Extra
          default: false
        min_rows:
          type: integer
          maximum: 10000000.0
          minimum: 0.0
          title: Min Rows
          default: 1
        max_rows:
          anyOf:
          - type: integer
            maximum: 10000000.0
            minimum: 1.0
          - type: 'null'
          title: Max Rows
        max_duplicate_rate:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Max Duplicate Rate
          default: 0.0
      additionalProperties: false
      type: object
      required:
      - name
      - fields
      title: DataContractCreate
    DatasetCreate:
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 1
          title: Name
        description:
          anyOf:
          - type: string
            maxLength: 4000
          - type: 'null'
          title: Description
        schema:
          anyOf:
          - $ref: '#/components/schemas/DatasetSchema'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - name
      title: DatasetCreate
    DatasetSchema:
      properties:
        fields:
          additionalProperties:
            $ref: '#/components/schemas/FieldDefinition'
          type: object
          title: Fields
        allow_extra:
          type: boolean
          title: Allow Extra
          default: false
      additionalProperties: false
      type: object
      title: DatasetSchema
    DriftComparisonCreate:
      properties:
        candidate_version_id:
          type: string
          maxLength: 100
          minLength: 1
          title: Candidate Version Id
      additionalProperties: false
      type: object
      required:
      - candidate_version_id
      title: DriftComparisonCreate
    FieldDefinition:
      properties:
        type:
          type: string
          enum:
          - string
          - integer
          - number
          - boolean
          - object
          - array
          - 'null'
          title: Type
        required:
          type: boolean
          title: Required
          default: true
      additionalProperties: false
      type: object
      required:
      - type
      title: FieldDefinition
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ImpactReportCreate:
      properties:
        changed_version_id:
          type: string
          maxLength: 100
          minLength: 1
          title: Changed Version Id

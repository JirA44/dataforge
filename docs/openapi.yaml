          type: string
          maxLength: 100
          minLength: 1
          title: Kind
        uri:
          anyOf:
          - type: string
            maxLength: 2048
          - type: 'null'
          title: Uri
        description:
          anyOf:
          - type: string
            maxLength: 4000
          - type: 'null'
          title: Description
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
      additionalProperties: false
      type: object
      required:
      - name
      - kind
